<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朝活トラッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#FCF6EC; --bg-mid:#F2EADC; --bg-bot:#ECE6DC;
    --card:#FCFAF4; --ink:#26241F; --sub:#6E6A62; --line:#E6DECF;
    --accent:#C98A5E; --accent2:#B0723F;
    --c-taka:#C98A5E; --c-haru:#7E9B72; --c-take:#8C7AA6;
    --g0:#E6DECF;
    --shadow:0 6px 24px rgba(176,114,63,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans JP',sans-serif;font-weight:300;
    background:
      radial-gradient(900px 500px at 50% -4%, rgba(214,150,95,.22), transparent 56%),
      radial-gradient(680px 520px at 85% 104%, rgba(110,133,147,.10), transparent 58%),
      linear-gradient(168deg,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-bot) 100%);
    background-attachment:fixed;
    color:var(--ink); min-height:100vh; padding:24px 16px 60px;
  }
  .mincho{font-family:'Shippori Mincho',serif}
  .wrap{max-width:760px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
  .logo{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:600;display:flex;align-items:center;letter-spacing:.08em}
  .logo span{color:var(--accent)}
  .logo-mark{display:inline-flex;align-items:center;margin-right:8px;color:var(--accent)}
  .logo-mark svg{display:block}
  .topnav{display:flex;align-items:center;gap:14px}
  .date{color:var(--sub);font-size:13px}
  .cockpit-link{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:10px 15px;border-radius:11px;white-space:nowrap;box-shadow:var(--shadow)}
  .cockpit-link:hover{filter:brightness(1.05)}

  /* 今日の参加チェックイン */
  .checkin-card{background:linear-gradient(150deg,#fff7ec,#fff);border:2px solid #ffe6cc;border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:20px}
  .ci-head{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:14px}
  .ci-head .ci-q{color:var(--sub);font-weight:700;font-size:12px;margin-left:6px}
  .ci-chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ci-chip{border:1px solid var(--line);background:#fff;color:var(--sub);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
  .ci-chip:hover{border-color:var(--accent)}
  .ci-chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .ci-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--sub)}
  .ci-chip.on .dot{background:#fff}
  .ci-save{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;font-weight:800;font-size:15px;padding:11px 24px;border-radius:11px;cursor:pointer;margin-left:6px}
  .ci-save:hover{filter:brightness(1.05)}
  .ci-save:disabled{opacity:.6;cursor:default}
  .ci-msg{font-size:13px;font-weight:700;color:var(--c-haru);margin-left:4px}
  .checkin-card.alert{border-color:var(--accent);animation:cardpulse 1.6s infinite}
  @keyframes cardpulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 4px rgba(255,140,66,.28)}}
  .ci-q.warn{color:var(--accent);font-weight:800}
  .mcheer{font-size:12px;font-weight:700;color:var(--c-haru);margin-top:8px}
  .mcheer.rest{color:var(--sub)}
  .mcheer.best{color:var(--accent)}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;padding:13px 24px;border-radius:14px;box-shadow:0 8px 28px rgba(255,150,80,.4);opacity:0;transition:.4s;z-index:100;font-size:15px;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* カレンダー */
  .cal-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:20px}
  .cal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .cal-titlewrap{display:flex;align-items:center;gap:10px}
  .cal-title{font-family:'Shippori Mincho',serif;font-size:21px;font-weight:600;min-width:128px;text-align:center;letter-spacing:.06em}
  .cal-nav{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--accent);font-size:20px;font-weight:800;cursor:pointer;line-height:1;padding:0}
  .cal-nav:hover{border-color:var(--accent);background:#fff7ec}
  .cal-sum{font-size:13px;color:var(--sub);font-weight:700}
  .cal-sum b{color:var(--accent);font-size:18px;margin:0 2px}
  .legend{display:flex;gap:16px;margin-bottom:14px;font-size:12px;color:var(--sub)}
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
  .c-taka{background:var(--c-taka)} .c-haru{background:var(--c-haru)} .c-take{background:var(--c-take)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;font-size:11px;color:var(--sub);font-weight:700;padding-bottom:2px}
  .cal-cell{aspect-ratio:1;border-radius:11px;background:#faf6f0;border:1px solid #f2ebe0;padding:7px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
  .cal-cell.empty{background:transparent;border:none}
  .cal-cell.future{opacity:.38}
  .cal-cell.today{border:2px solid var(--accent);background:#fff3e7;box-shadow:0 0 0 3px rgba(255,140,66,.12)}
  .cal-num{font-size:12px;font-weight:700;color:var(--ink);line-height:1}
  .cal-cell.today .cal-num{color:var(--accent)}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
  .cal-dots .dot{width:8px;height:8px}
  @media(max-width:480px){
    .cal-cell{padding:5px 2px 3px;gap:3px} .cal-dots .dot{width:6px;height:6px} .cal-num{font-size:11px}
  }

  /* メンバー（ストリーク） */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .mhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .mname{font-family:'Shippori Mincho',serif;font-weight:600;font-size:16px;letter-spacing:.04em}
  .streak-big{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:600;color:var(--accent)}
  .streak-big.cold{color:var(--sub)}
  .msub{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
  .msub b{color:var(--ink)}
  .bar{height:6px;border-radius:3px;background:var(--g0);margin-top:9px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#7ed18a,#5cb85c)}

  /* 月次サマリー */
  .summary-card{background:linear-gradient(150deg,#fff7ec,#fff);border:1px solid #ffe6cc;border-radius:16px;padding:15px 18px;box-shadow:var(--shadow);margin-bottom:20px;font-size:14px;font-weight:700;color:var(--ink);line-height:1.8}
  .summary-card b{color:var(--accent)}
  /* テーマ履歴 */
  .theme-history{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:24px}
  .th-title{font-size:14px;font-weight:800;margin-bottom:12px}
  .th-list{list-style:none;max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .th-list li{display:flex;align-items:baseline;gap:10px;font-size:13px;padding:9px 11px;background:#faf6f0;border-radius:9px}
  .th-date{color:var(--sub);font-weight:700;flex-shrink:0;width:42px}
  .th-text{flex:1;font-weight:600;color:var(--ink);line-height:1.4}
  .th-owner{color:var(--accent);font-weight:700;font-size:12px;flex-shrink:0}

  .foot{text-align:center;color:var(--sub);font-size:11px;margin-top:8px;line-height:1.7}
</style>
</head>

<div class="wrap">
  <header>
    <div class="logo"><span class="logo-mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg></span>朝活<span>トラッカー</span></div>

      <span><i class="dot c-take"></i>竹花</span>

    <div class="cal-grid" id="calGrid"></div>

  <div class="grid" id="members"></div>

  <div class="theme-history" id="themeHistory" style="display:none">
    <div class="th-title">📖 これまでのテーマ</div>
    <ol class="th-list" id="thList"></ol>
  </div>

  <div class="foot">
    ※ これはプロトタイプです（実データ：2026/01〜05）。記録はコックピットの完了画面から。
  </div>
</div>

let CURRENT=null, viewY=null, viewM=null;
function ensureView(){ if(viewY===null){ viewY=+TODAY.slice(0,4); viewM=+TODAY.slice(5,7); } }
function ymd(s){return new Date(s.replace(/\//g,'-')+'T00:00:00')}
function pad(n){return String(n).padStart(2,'0')}
function fmtJP(s){const d=ymd(s);return `${d.getMonth()+1}月${d.getDate()}日(${DOW[(d.getDay()+6)%7]})`}

// 今日から遡る連続参加日数
function streak(dates){
  const set=new Set(dates);
  let n=0, d=ymd(TODAY);
  if(!set.has(TODAY)) d.setDate(d.getDate()-1);
  while(true){
    const k=`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
    if(set.has(k)){n++;d.setDate(d.getDate()-1)}else break;
  }
  return n;
}
function monthRate(dates, y, m){
  const key=`${y}/${pad(m)}`;
  const days=dates.filter(x=>x.startsWith(key)).length;
  const ty=+TODAY.slice(0,4), tm=+TODAY.slice(5,7);
  const isThisMonth=(y===ty && m===tm);
  // 今月は今日までの経過日数、それ以外はその月の総日数で割る
  const elapsed = isThisMonth ? parseInt(TODAY.slice(8,10),10) : new Date(y,m,0).getDate();
  return {days, rate: elapsed?Math.round(days/elapsed*100):0};
}

function render(data){
  CURRENT=data;
  ensureView();
  renderCheckin(data);
  document.getElementById('todayLabel').textContent = fmtJP(TODAY);
  renderCalendar(data);
  renderMembers(data);
  renderThemes(data);
}

// 月次サマリー（表示月連動）
function longestStreak(dates){
  if(!dates.length) return 0;
  const set=[...new Set(dates)].sort();
  let best=1, cur=1;
  for(let i=1;i<set.length;i++){
    if(ymd(set[i])-ymd(set[i-1])===86400000){ cur++; if(cur>best)best=cur; } else cur=1;
  }
  return best;
}
// メンバーの励まし文（途切れ防止・自己ベスト）
function encourage(dates, s){
  const best=longestStreak(dates);
  if(s===0) return {text:'🌱 また一緒にやろう', cls:'rest'};
  if(s>best) return {text:'🏆 自己ベスト更新中！', cls:'best'};
  if(s===best && s>1) return {text:'🏆 自己ベストタイ！', cls:'best'};
  if(best-s>0 && best-s<=3) return {text:`自己ベストまであと${best-s+1}日`, cls:''};
  return {text:'いい調子！', cls:''};
}
// 画面上部トースト
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'), 3500);
}
function renderSummary(data){
  const ty=+TODAY.slice(0,4), tm=+TODAY.slice(5,7);
  const isThisMonth=(viewY===ty && viewM===tm);
  const label=isThisMonth?'今月':`${viewM}月`;
  const key=`${viewY}/${pad(viewM)}`;
  const daysInMonth=new Date(viewY,viewM,0).getDate();
  let openDays=0;
  for(let day=1;day<=daysInMonth;day++){
    const ds=`${viewY}/${pad(viewM)}/${pad(day)}`;
    if(MEMBERS.some(m=>(data.records[m]||[]).includes(ds))) openDays++;
  }
  const counts=MEMBERS.map(m=>({m, n:(data.records[m]||[]).filter(x=>x.startsWith(key)).length}));
  const mvp=counts.reduce((a,b)=>b.n>a.n?b:a);
  const best=MEMBERS.map(m=>({m, len:longestStreak(data.records[m]||[])})).reduce((a,b)=>b.len>a.len?b:a);
  document.getElementById('summaryCard').innerHTML =
    `📊 ${label}のまとめ：開催 <b>${openDays}日</b>　／　最長連続 🔥${best.m} ${best.len}日　／　MVP ${mvp.m}（${mvp.n}日）`;
}

// テーマ履歴（新しい順）
function renderThemes(data){
  const box=document.getElementById('themeHistory');
  if(!data.themes || !data.themes.length){ box.style.display='none'; return; }
  box.style.display='';
  const items=data.themes.slice().reverse();
  document.getElementById('thList').innerHTML = items.map(t=>
    `<li><span class="th-date">${t.date.slice(5)}</span><span class="th-text">${t.theme}</span>${t.owner?`<span class="th-owner">${t.owner}</span>`:''}</li>`
  ).join('');
}

// カレンダー（表示中の月 viewY/viewM を描画）
function renderCalendar(data){
  const year=viewY, month=viewM;
  document.getElementById('calTitle').textContent = `${year}年${month}月`;
  const came = ds => MEMBERS.filter(m=>(data.records[m]||[]).includes(ds));
  const daysInMonth=new Date(year,month,0).getDate();
  const firstDow=(new Date(year,month-1,1).getDay()+6)%7; // 月=0 … 日=6
  const grid=document.getElementById('calGrid'); grid.innerHTML='';
  DOW.forEach(w=>{const e=document.createElement('div');e.className='cal-dow';e.textContent=w;grid.appendChild(e);});
  for(let i=0;i<firstDow;i++){const e=document.createElement('div');e.className='cal-cell empty';grid.appendChild(e);}
  let openDays=0;
  for(let day=1;day<=daysInMonth;day++){
    const ds=`${year}/${pad(month)}/${pad(day)}`;
    const people=came(ds);
    if(people.length) openDays++;
    const isToday=(ds===TODAY), isFuture=(ds>TODAY);
    const cell=document.createElement('div');
    cell.className='cal-cell'+(isToday?' today':'')+(isFuture?' future':'');
    const dots=people.map(m=>`<span class="dot ${CLASS[m]}"></span>`).join('');
    cell.innerHTML=`<div class="cal-num">${day}</div><div class="cal-dots">${dots}</div>`;
    grid.appendChild(cell);
  }
  const isThisMonth=(year===+TODAY.slice(0,4) && month===+TODAY.slice(5,7));
  document.getElementById('calSum').innerHTML = `${isThisMonth?'今月':'この月'} みんなで <b>${openDays}</b> 日 開催 🌅`;
}

// メンバーのストリーク（今月・今日基準で固定）
function renderMembers(data){
  const ty=+TODAY.slice(0,4), tm=+TODAY.slice(5,7);
  const isThisMonth=(viewY===ty && viewM===tm);
  const label = isThisMonth ? '今月' : `${viewM}月`;
  const mg=document.getElementById('members'); mg.innerHTML='';
  MEMBERS.forEach(m=>{
    const dates=data.records[m]||[];
    const s=streak(dates);
    const mr=monthRate(dates, viewY, viewM);
    const ch=encourage(dates, s);
    const el=document.createElement('div');
    el.className='mcard';
    el.innerHTML=`
      <div class="mhead"><i class="dot ${CLASS[m]}"></i><span class="mname">${m}</span></div>
      <div class="streak-big ${s>0?'':'cold'}">${s>0?'🔥 '+s+'日連続':'― お休み中'}</div>
      <div class="msub">${label} <b>${mr.days}日</b>・${mr.rate}%　／　通算 <b>${dates.length}日</b></div>
      <div class="bar"><i style="width:${mr.rate}%"></i></div>
      ${ch?`<div class="mcheer ${ch.cls}">${ch.text}</div>`:''}`;
    mg.appendChild(el);
  });
}

// 今日の参加チェックイン（トラッカーでその場で押せる）
function renderCheckin(data){
  document.getElementById('ciDate').textContent = fmtJP(TODAY);
  // 今日まだ未記録なら強調して促す
  const todayCount=MEMBERS.filter(m=>(data.records[m]||[]).includes(TODAY)).length;
  const card=document.querySelector('.checkin-card');
  const q=document.querySelector('.ci-q');
  if(todayCount===0){ if(card)card.classList.add('alert'); if(q){q.textContent='⚠️ まだ今日の参加が記録されていません';q.classList.add('warn');} }
  else { if(card)card.classList.remove('alert'); if(q){q.textContent='（来た人を選んで「記録する」）';q.classList.remove('warn');} }
  const wrap=document.getElementById('ciChips'); wrap.innerHTML='';
  MEMBERS.forEach(m=>{
    const on=(data.records[m]||[]).includes(TODAY);
    const b=document.createElement('button');
    b.className='ci-chip'+(on?' on':'');
    b.dataset.m=m;
    b.innerHTML=`<span class="dot"></span>${m}`;
    b.onclick=()=>b.classList.toggle('on');
    wrap.appendChild(b);
  });
  const save=document.createElement('button');
  save.className='ci-save'; save.textContent='記録する';
  save.onclick=saveCheckin;
  wrap.appendChild(save);
  const msg=document.createElement('span');
  msg.className='ci-msg'; msg.id='ciMsg';
  wrap.appendChild(msg);
}
function saveCheckin(){
  const came=[...document.querySelectorAll('#ciChips .ci-chip.on')].map(c=>c.dataset.m);
  const msg=document.getElementById('ciMsg');
  const btn=document.querySelector('.ci-save');
  if(!GAS_URL){ msg.textContent='✓ '+(came.join('・')||'なし')+'（デモ：保存されません）'; return; }
  btn.disabled=true; msg.textContent='保存中…';
  fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'checkin',date:TODAY,members:came})})
    .then(r=>r.json()).then(res=>{
      if(res.ok){
        msg.textContent='✓ 記録しました';
        // ローカルデータを更新してカレンダー・ストリークを即反映
        if(!CURRENT.dates.includes(TODAY)) CURRENT.dates.push(TODAY);
        MEMBERS.forEach(m=>{
          const arr=CURRENT.records[m]=CURRENT.records[m]||[];
          const i=arr.indexOf(TODAY);
          if(came.includes(m)){ if(i<0) arr.push(TODAY); }
          else if(i>=0){ arr.splice(i,1); }
        });
        render(CURRENT);
        setTimeout(()=>{const mm=document.getElementById('ciMsg'); if(mm)mm.textContent='✓ 記録しました';},50);
        // ストリーク達成をお祝い
        const cheers=came.map(m=>({m, s:streak(CURRENT.records[m]||[])})).filter(x=>x.s>=2);
        if(cheers.length){ const top=cheers.reduce((a,b)=>b.s>a.s?b:a); showToast(`🔥 ${top.m} ${top.s}日連続！`); }
      }else{ msg.textContent='⚠ '+res.error; }
    }).catch(()=>{ msg.textContent='⚠ 通信エラー'; })
    .then(()=>{ const b=document.querySelector('.ci-save'); if(b)b.disabled=false; });
}

// 月ナビ
document.getElementById('prevMonth').onclick=()=>{ ensureView(); viewM--; if(viewM<1){viewM=12;viewY--;} const d=CURRENT||DATA; renderCalendar(d); renderMembers(d); };
document.getElementById('nextMonth').onclick=()=>{ ensureView(); viewM++; if(viewM>12){viewM=1;viewY++;} const d=CURRENT||DATA; renderCalendar(d); renderMembers(d); };

// 起動
if(GAS_URL){
  fetch(GAS_URL+'?action=data').then(r=>r.json()).then(res=>{
    render(res && res.ok ? res : DATA);
  }).catch(()=>render(DATA));
}else{
  render(DATA);
}
</script>
